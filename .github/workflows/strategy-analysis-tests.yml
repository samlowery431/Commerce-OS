name: Strategy analysis unit tests
on:
  push:
    paths:
      - 'backtesting/slice_analysis.py'
      - 'backtesting/test_slice_analysis.py'
      - '.github/workflows/strategy-analysis-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run analysis unit tests
        run: cd backtesting && python3 -m unittest -v test_slice_analysis.py

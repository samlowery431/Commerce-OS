name: Backtesting infrastructure smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtesting/**'
      - '.github/workflows/backtesting-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic synthetic backtest
        run: python3 backtesting/smoke.py
      - name: Save result artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtesting-smoke-result
          path: backtesting/smoke-result.json
          retention-days: 7

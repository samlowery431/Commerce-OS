name: Secret Pattern Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common committed credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(SUPABASE_SERVICE_ROLE_KEY|COMMERCE_OS_NODE_TOKEN)=[^[:space:]]+' -- ':!*.example' ':!**/*.example' ; then
            echo 'Possible committed credential value detected.' >&2
            exit 1
          fi
